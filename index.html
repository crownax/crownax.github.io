<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Итальянские карточки</title>
<style>
:root{--bg:#faf7f2;--fg:#1f2430;--mut:#6b7280;--card:#fff;--ac:#2f7d5b;--acfg:#fff;--bad:#c0392b;--bd:#e5e0d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--fg:#eceef2;--mut:#9aa1ad;--card:#20242c;--ac:#4cae86;--acfg:#0d1a14;--bad:#e5645a;--bd:#323844;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181e;--fg:#eceef2;--mut:#9aa1ad;--card:#20242c;--ac:#4cae86;--acfg:#0d1a14;--bad:#e5645a;--bd:#323844;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px}h2{font-size:20px;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:12px 16px;cursor:pointer}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
button.d{color:var(--bad)}
button.l{border:0;background:none;color:var(--mut);padding:8px 0}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:12px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px}
.mut{color:var(--mut);font-size:15px}
.seg button{padding:10px 6px;font-size:15px}.seg button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.w{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.w b{display:block}.w .x{flex:0 0 auto;padding:4px 10px}
.card{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;margin:16px 0;cursor:pointer;user-select:none}
.card .t{font-size:32px;font-weight:700;word-break:break-word}
.card .lb{font-size:14px;color:var(--mut);margin-bottom:12px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
details{margin:12px 0}summary{cursor:pointer;color:var(--ac);padding:6px 0}
</style></head><body><div id="app"></div>
<script>
var KEY="ital-cards-v1";
var D={lessons:[
{id:1,name:"Урок 1 — Приветствия",words:[["Ciao","Привет / пока"],["Buongiorno","Доброе утро / добрый день"],["Buonasera","Добрый вечер"],["Arrivederci","До свидания"],["Grazie","Спасибо"],["Prego","Пожалуйста"],["Scusi","Извините"],["Sì","Да"],["No","Нет"]]},
{id:2,name:"Урок 2 — Числа",words:[["uno","один"],["due","два"],["tre","три"],["quattro","четыре"],["cinque","пять"],["sei","шесть"],["sette","семь"],["otto","восемь"],["nove","девять"],["dieci","десять"]]}
].map(function(l){l.words=l.words.map(function(w){return{it:w[0],ru:w[1]}});return l})};
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&p.lessons)D=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var view="home",cur=null,mode="mix",S=null,app=document.getElementById("app");
function L(){return D.lessons.find(function(l){return l.id===cur})}
function go(v,id){view=v;if(id!==undefined)cur=id;render()}
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function addLesson(){var n=document.getElementById("ln").value.trim();if(!n)return;var id=Date.now();D.lessons.push({id:id,name:n,words:[]});save();go("lesson",id)}
function delLesson(){if(confirm("Удалить урок со всеми словами?")){D.lessons=D.lessons.filter(function(l){return l.id!==cur});save();go("home")}}
function addWord(){var a=document.getElementById("wi").value.trim(),b=document.getElementById("wr").value.trim();if(!a||!b)return;L().words.push({it:a,ru:b});save();render();document.getElementById("wi").focus()}
function addBulk(){var t=document.getElementById("bk").value.split("\n"),n=0;t.forEach(function(r){var m=r.split(/\s*[-–—=;:\t]\s*/);if(m.length>=2&&m[0].trim()&&m[1].trim()){L().words.push({it:m[0].trim(),ru:m.slice(1).join(" - ").trim()});n++}});if(n){save();render()}else alert("Формат: слово - перевод, по одному в строке")}
function delWord(i){L().words.splice(i,1);save();render()}
function setMode(m){mode=m;render()}
function start(){var w=L().words;if(!w.length)return;S={q:shuffle(w).map(function(x){return{w:x,side:mode==="mix"?(Math.random()<.5?"it":"ru"):mode}}),n:w.length,flip:false,known:0};view="study";render()}
function flip(){S.flip=true;render()}
function answer(ok){var c=S.q.shift();if(ok)S.known++;else{c.side=c.side;S.q.push(c)}S.flip=false;render()}
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(function(){alert(msg)},function(){prompt("Скопируйте вручную:",t)})}catch(e){prompt("Скопируйте вручную:",t)}}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
function shareLesson(){var l=L();copyText(location.href.split("#")[0]+"#l="+enc({name:l.name,words:l.words}),"Ссылка на урок скопирована. Отправьте её в Телеграм.")}
function exportAll(){var t=document.getElementById("bkp");t.value=enc(D);t.select();copyText(t.value,"Копия скопирована")}
function mergeIn(o){var ls=o.lessons||[{name:o.name,words:o.words}],n=0;ls.forEach(function(l){if(l&&l.name&&Array.isArray(l.words)){D.lessons.push({id:Date.now()+n,name:String(l.name),words:l.words.filter(function(w){return w&&w.it&&w.ru}).map(function(w){return{it:String(w.it),ru:String(w.ru)}})});n++}});save();return n}
function importAll(){var v=document.getElementById("bkp").value.trim().replace(/^.*#l=/,"");try{var n=mergeIn(dec(v));alert("Добавлено уроков: "+n);render()}catch(e){alert("Не удалось прочитать код. Вставьте его целиком.")}}
function checkHash(){var m=location.hash.match(/^#l=(.+)$/);if(!m)return;try{var o=dec(m[1]);if(confirm("Добавить урок «"+o.name+"» ("+o.words.length+" сл.)?")){mergeIn(o);view="home";render()}}catch(e){}history.replaceState(null,"",location.pathname+location.search)}
try{navigator.storage.persist()}catch(e){}
function render(){
if(view==="home"){
var h='<h1>🇮🇹 Итальянские карточки</h1>';
D.lessons.forEach(function(l){h+='<button class="item" onclick="go(\'lesson\','+l.id+')"><span>'+esc(l.name)+'</span><span class="mut">'+l.words.length+' сл.</span></button>'});
h+='<h2 style="margin-top:20px">Новый урок</h2><input id="ln" placeholder="Например: Урок 3 — Еда"><button class="p" style="width:100%" onclick="addLesson()">Создать урок</button>';
h+='<details style="margin-top:20px"><summary>Копия и перенос слов</summary><textarea id="bkp" rows="4" placeholder="Код копии"></textarea><div class="row"><button onclick="exportAll()">Скопировать всё</button><button onclick="importAll()">Импортировать</button></div></details>';
app.innerHTML=h;return}
if(view==="lesson"){
var l=L(),h='<button class="l" onclick="go(\'home\')">← Все уроки</button><h1>'+esc(l.name)+'</h1>';
h+='<div class="row seg" style="margin-bottom:8px"><button class="'+(mode==="it"?"on":"")+'" onclick="setMode(\'it\')">Итал. → рус.</button><button class="'+(mode==="ru"?"on":"")+'" onclick="setMode(\'ru\')">Рус. → итал.</button><button class="'+(mode==="mix"?"on":"")+'" onclick="setMode(\'mix\')">Вперемешку</button></div>';
h+='<button class="p" style="width:100%;margin-bottom:16px" onclick="start()"'+(l.words.length?'':' disabled')+'>Учить ('+l.words.length+')</button>';
h+='<h2>Добавить слово</h2><div style="margin-top:8px"><input id="wi" placeholder="По-итальянски" autocapitalize="off"><input id="wr" placeholder="По-русски"><button class="p" style="width:100%" onclick="addWord()">Добавить</button></div>';
h+='<details><summary>Добавить сразу много слов</summary><textarea id="bk" rows="5" placeholder="gatto - кошка&#10;cane - собака"></textarea><button style="width:100%" onclick="addBulk()">Добавить списком</button></details>';
h+='<h2 style="margin-top:12px">Слова</h2>';
if(!l.words.length)h+='<p class="mut">Пока пусто — добавьте первое слово.</p>';
l.words.forEach(function(w,i){h+='<div class="w"><div><b>'+esc(w.it)+'</b><span class="mut">'+esc(w.ru)+'</span></div><div class="row" style="flex:0 0 auto"><button class="x" onclick="say(L().words['+i+'].it)">🔊</button><button class="x d" onclick="delWord('+i+')">✕</button></div></div>'});
h+='<button style="width:100%;margin-top:24px" onclick="shareLesson()">Поделиться уроком (ссылкой)</button>';
h+='<button class="d" style="width:100%;margin-top:8px" onclick="delLesson()">Удалить урок</button>';
app.innerHTML=h;return}
if(view==="study"){
if(!S.q.length){app.innerHTML='<h1>Готово! 🎉</h1><p>Вы прошли все '+S.n+' карточек.</p><button class="p" style="width:100%;margin-bottom:8px" onclick="start()">Ещё раз</button><button style="width:100%" onclick="go(\'lesson\')">К уроку</button>';return}
var c=S.q[0],w=c.w,front=c.side==="it"?w.it:w.ru,back=c.side==="it"?w.ru:w.it;
var h='<div class="row" style="margin-bottom:12px"><button class="l" style="flex:0 0 auto" onclick="go(\'lesson\')">← Выйти</button><span class="mut" style="text-align:right">Выучено '+S.known+' из '+S.n+'</span></div><div class="bar"><i style="width:'+(S.known/S.n*100)+'%"></i></div>';
h+='<div class="card" onclick="'+(S.flip?'':'flip()')+'"><div class="lb">'+(c.side==="it"?"Итальянский":"Русский")+'</div><div class="t">'+esc(front)+'</div>';
if(S.flip)h+='<hr style="width:60%;border:0;border-top:1px solid var(--bd);margin:20px 0"><div class="lb">'+(c.side==="it"?"Русский":"Итальянский")+'</div><div class="t">'+esc(back)+'</div>';
else h+='<div class="mut" style="margin-top:20px">Скажите вслух, потом нажмите на карточку</div>';
h+='</div><button style="width:100%;margin-bottom:8px" onclick="say(S.q[0].w.it)">🔊 Послушать по-итальянски</button>';
if(S.flip)h+='<div class="row"><button class="d" onclick="answer(false)">Не знаю</button><button class="p" onclick="answer(true)">Знаю</button></div>';
app.innerHTML=h;return}
}
render();checkHash();
</script></body></html>
